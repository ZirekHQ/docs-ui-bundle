name: Build and publish UI bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build UI bundle
        run: node_modules/.bin/gulp bundle

      - name: Publish as the "latest" release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: Latest UI bundle
          prerelease: true
          body: Automatically published from the latest commit on main. Not a versioned release -- this tag is overwritten on every push.
          files: build/ui-bundle.zip
